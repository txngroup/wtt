name: Live check

# Checks every hour, and after each deploy, that the live site serves exactly the files of the latest release.
# Runs only when the repository sets vars.LIVE_CHECK_URL, the address to check.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: vars.LIVE_CHECK_URL != '' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'wtt-*.zip' --dir release
          unzip -q release/wtt-*.zip -d release/site
      - run: node scripts/verify.mjs "$LIVE_CHECK_URL" release/site
        env:
          LIVE_CHECK_URL: ${{ vars.LIVE_CHECK_URL }}
